<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141926" />
      <stop offset="100%" stop-color="#07080D" />
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Subtle ambient glow -->
  <circle cx="256" cy="256" r="210" fill="url(#glow)" />
  
  <!-- Concentric harmonic breathing petals & rings -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#ringGrad1)" stroke-width="2.5" opacity="0.4" stroke-dasharray="4 8" />
  <circle cx="256" cy="256" r="105" fill="none" stroke="url(#ringGrad2)" stroke-width="3" opacity="0.7" />
  <circle cx="256" cy="256" r="68" fill="none" stroke="#e0e7ff" stroke-width="4" opacity="0.85" />
  
  <!-- Overlapping breathing orbs / seed of life motif -->
  <circle cx="256" cy="200" r="56" fill="none" stroke="url(#ringGrad1)" stroke-width="2" opacity="0.5" />
  <circle cx="256" cy="312" r="56" fill="none" stroke="url(#ringGrad1)" stroke-width="2" opacity="0.5" />
  <circle cx="200" cy="256" r="56" fill="none" stroke="url(#ringGrad2)" stroke-width="2" opacity="0.5" />
  <circle cx="312" cy="256" r="56" fill="none" stroke="url(#ringGrad2)" stroke-width="2" opacity="0.5" />

  <!-- Center core pearl -->
  <circle cx="256" cy="256" r="28" fill="#ffffff" opacity="0.95" />
  <circle cx="256" cy="256" r="14" fill="#38bdf8" />
</svg>
